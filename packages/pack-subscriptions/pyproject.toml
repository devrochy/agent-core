[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pack-subscriptions"
version = "0.1.0"
description = "Suscripciones de cliente final sobre planes (ADR-0083, Opción B)"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."agent_core.plugins"]
pack_subscriptions = "pack_subscriptions.module:SubscriptionsModule"

[tool.setuptools.packages.find]
include = ["pack_subscriptions*"]

[tool.agent_core.plugin.entities]
pack_subscriptions_plans = ["nombre", "precio", "periodicidad"]
pack_subscriptions_subscriptions = ["customer_id", "plan_id", "estado", "proximo_cargo"]
pack_subscriptions_charges = ["subscription_id", "periodo", "monto", "estado"]