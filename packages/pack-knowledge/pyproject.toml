[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pack-knowledge"
version = "0.3.0"
description = "Pack de conocimiento: documentos por agente con búsqueda en pgvector (ADR-0145, HU-AOS-49)"
requires-python = ">=3.12"
# Extracción de texto (ADR-0145 §2): sin binarios del sistema.
dependencies = ["pypdf>=6.0", "python-docx>=1.1"]

[project.entry-points."agent_core.plugins"]
pack_knowledge = "pack_knowledge.module:KnowledgeModule"

[tool.setuptools.packages.find]
include = ["pack_knowledge*"]

[tool.agent_core.plugin]
# Manifest del pack (ADR-0019). Sin salida a red: los embeddings los pide el servicio del core
# (`core/llm/embeddings.py`) y la ingesta por URL está pospuesta (ADR-0145 §2).
network = []

[tool.agent_core.plugin.entities]
pack_knowledge_documents = ["titulo", "estado", "mime", "bytes"]
