{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1 class="fs-3 mb-3">{{ title }}</h1>
<div class="card">
  <div class="card-body">
    <form method="post" action="/cobranza/{{ entity }}/guardar">
      <input type="hidden" name="record_id" value="{{ record_id }}">
      {{ form_fields | safe }}
      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-primary">Guardar</button>
        <a class="btn btn-outline-secondary" href="/cobranza/{{ entity }}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
