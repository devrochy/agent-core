{% extends "base.html" %}
{% block title %}Calendar · Citas{% endblock %}
{% block content %}
<h1 class="fs-3 mb-4">Calendar · Citas</h1>
<div class="alert alert-warning d-none" id="google-error-alert">
  No se pudieron cargar los eventos de Google (revisá la conexión en Calendar · Conexión).
  Mostrando las citas del asistente.
</div>
<div class="card">
  <div class="card-body">
    <div id="calendar"></div>
  </div>
</div>

{# Modal de detalle de la cita/evento #}
<div class="modal fade" id="modal-cita" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-cita-titulo">Cita</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modal-cita-cuerpo"></div>
      <div class="modal-footer" id="modal-cita-acciones"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/es.global.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const timezone = {{ calendar_timezone | tojson }};
  const calendarEl = document.getElementById('calendar');
  const GOOGLE_LINK = 'https://www.google.com/calendar/r/eventedit/';

  function fmt(fecha) {
    if (!fecha) return '—';
    try { return fecha.toLocaleString('es-CO', { dateStyle: 'full', timeStyle: 'short' }); }
    catch (e) { return fecha.toLocaleString(); }
  }

  function badge(estado) {
    const map = { scheduled: ['agendada', 'success'], cancelled: ['cancelada', 'secondary'], confirmed: ['confirmado', 'info'] };
    const [label, tipo] = map[estado] || [estado, 'secondary'];
    return '<span class="badge text-bg-' + tipo + '">' + label + '</span>';
  }

  function abrirDetalle(info) {
    const p = info.event.extendedProps || {};
    const estado = p.status || 'confirmed';
    document.getElementById('modal-cita-titulo').textContent = info.event.title;
    document.getElementById('modal-cita-cuerpo').innerHTML =
      '<dl class="row mb-0">' +
        '<dt class="col-sm-4">Cuándo</dt><dd class="col-sm-8">' + fmt(info.event.start) + '</dd>' +
        '<dt class="col-sm-4">Estado</dt><dd class="col-sm-8">' + badge(estado) + '</dd>' +
        '<dt class="col-sm-4">Origen</dt><dd class="col-sm-8">' +
          (p.source === 'asistente' ? 'Asistente' : 'Google (externo)') + '</dd>' +
        (p.attendee_email ? '<dt class="col-sm-4">Cliente</dt><dd class="col-sm-8">' + p.attendee_email + '</dd>' : '') +
        (p.description ? '<dt class="col-sm-4">Detalle</dt><dd class="col-sm-8">' + p.description + '</dd>' : '') +
      '</dl>';
    const acciones = document.getElementById('modal-cita-acciones');
    acciones.innerHTML = '';
    if (p.html_link) {
      const a = document.createElement('a');
      a.className = 'btn btn-outline-secondary';
      a.href = p.html_link; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = 'Abrir en Google';
      acciones.appendChild(a);
    }
    if (p.can_cancel) {
      const f = document.createElement('form');
      f.method = 'post';
      f.action = '/calendar/citas/' + p.appointment_id + '/cancelar';
      f.onsubmit = function () { return confirm('¿Cancelar esta cita? Se borra también en Google Calendar.'); };
      const b = document.createElement('button');
      b.className = 'btn btn-outline-danger';
      b.type = 'submit';
      b.textContent = 'Cancelar cita';
      f.appendChild(b);
      acciones.appendChild(f);
    }
    if (!acciones.children.length) {
      const cerrar = document.createElement('button');
      cerrar.className = 'btn btn-secondary';
      cerrar.setAttribute('data-bs-dismiss', 'modal');
      cerrar.textContent = 'Cerrar';
      acciones.appendChild(cerrar);
    }
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modal-cita')).show();
  }

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'timeGridWeek',
    initialDate: {{ calendar_initial_date | tojson }},
    locale: 'es',
    timeZone: timezone,
    height: 'auto',
    nowIndicator: true,
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,timeGridDay'
    },
    buttonText: { month: 'Mes', week: 'Semana', day: 'Día', today: 'Hoy' },
    events: function (info, success, failure) {
      // Fetch controlado por nosotros: envía la sesión (same-origin) y, si el
      // endpoint responde algo no iterable (401/redirect), llamamos failure()
      // en vez de dejar que FullCalendar rompa su ciclo (TypeError e is not iterable).
      const params = '?start=' + encodeURIComponent(info.start.toISOString()) +
                     '&end=' + encodeURIComponent(info.end.toISOString());
      fetch('/calendar/citas/calendario.json' + params, { credentials: 'same-origin' })
        .then(function (r) { if (!r.ok) { throw new Error('HTTP ' + r.status); } return r.json(); })
        .then(function (data) {
          if (data.google_error) {
            document.getElementById('google-error-alert').classList.remove('d-none');
          } else {
            document.getElementById('google-error-alert').classList.add('d-none');
          }
          success(data.events || []);
        })
        .catch(failure);
    },
    eventSourceFailure: function () {
      document.getElementById('google-error-alert').classList.remove('d-none');
    },
    eventClick: abrirDetalle,
    eventDidMount: function (info) {
      if ((info.event.extendedProps.status || '') === 'cancelled') {
        info.el.style.opacity = 0.45;
        info.el.style.textDecoration = 'line-through';
      }
    }
  });
  calendar.render();
});
</script>
{% endblock %}
