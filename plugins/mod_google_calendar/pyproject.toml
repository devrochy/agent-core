[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mod-google-calendar"
version = "1.0.0"
description = "Google Calendar para agent-core: agendamiento de citas con OAuth2"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.entry-points."agent_core.plugins"]
mod_google_calendar = "mod_google_calendar.module:GoogleCalendarModule"

[tool.setuptools.packages.find]
include = ["mod_google_calendar*"]

[tool.agent_core.plugin]
