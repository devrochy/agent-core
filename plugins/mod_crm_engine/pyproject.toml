[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mod-crm-engine"
version = "2.0.0"
description = "CRM completo para agent-core: leads, catálogo (menú), promociones y pedidos"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."agent_core.plugins"]
mod_crm_engine = "mod_crm_engine.module:CRMModule"

[tool.setuptools.packages.find]
include = ["mod_crm_engine*"]

[tool.agent_core.plugin]
# Entidades para el wizard de importación (agent-core plugin install)
[tool.agent_core.plugin.entities]
crm_leads = ["name", "phone", "email", "interest", "score", "status"]
crm_products = ["name", "price", "stock", "description"]
crm_orders = ["total", "status", "payment_status"]
