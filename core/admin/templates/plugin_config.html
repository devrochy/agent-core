{% extends "base.html" %}
{% block title %}Configurar {{ plugin_name }}{% endblock %}
{% block content %}
<h1 class="fs-3 mb-1">Configurar: {{ plugin_name }}</h1>
<p class="text-secondary mb-4">{{ plugin_description }}</p>
<div class="card" style="max-width: 640px">
  <div class="card-body">
    <form method="post" action="/admin/plugins/{{ plugin_id }}/configurar">
      {{ form_fields | safe }}
      <button class="btn btn-primary">Guardar y activar</button>
      <a href="/admin/plugins" class="btn btn-outline-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
