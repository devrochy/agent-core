<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · {{ assistant_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="card shadow" style="width: 380px">
    <div class="card-body p-4">
      <h1 class="fs-4 fw-bold text-center mb-1">🤖 {{ assistant_name }}</h1>
      <p class="text-secondary text-center mb-4">Panel de administración</p>
      {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
      <form method="post" action="/admin/login">
        <div class="mb-3">
          <label class="form-label">Correo o usuario</label>
          <input type="text" name="email" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100">Ingresar</button>
      </form>
    </div>
  </div>
</body>
</html>
