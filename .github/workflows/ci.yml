name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent_core
          POSTGRES_PASSWORD: agent_core
          POSTGRES_DB: agent_core
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://app_runtime:app_runtime@localhost:5432/agent_core
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://agent_core:agent_core@localhost:5432/agent_core
      REDIS_URL: redis://localhost:6379/0
      MASTER_ENCRYPTION_KEY: GpsiZ2sgMd4SvLHGp4Bs5xdaQLlQ1cByyK6DCNxVwL4=
      TOKEN_MASTER_KEYS: '{"k1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}'
      TOKEN_ACTIVE_KEY_ID: k1
      APP_SECRET_KEY: ci-only-not-a-secret-app-key
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar (core + plugins)
        run: |
          pip install -e packages/contracts
          pip install -e ".[dev]"
          bash scripts/install_plugins.sh

      - name: Lint
        run: ruff check core cli scripts alembic evals tests

      - name: Migrar y sembrar
        env:
          # Password determinística solo para que los tests de integración puedan
          # loguearse (default de init_db.py es aleatoria, correcto en producción).
          ADMIN_PASSWORD: admin123
        run: |
          agent-core db migrate
          python scripts/init_db.py

      - name: Tests unitarios
        run: pytest -q

      - name: Tests de integración (aislamiento multi-tenant, RLS, webhooks)
        env:
          AGENT_CORE_INTEGRATION: "1"
        run: pytest tests/integration -q

      - name: Gate de evals (subconjunto crítico)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        # Camino feliz + manipulación + escalamiento: las regresiones que importan.
        run: python evals/runner.py "06,07,08,21,22,23,24,25,26"