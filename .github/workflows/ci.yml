name: CI

# CI por niveles (ADR-0120):
#   - PR → develop (o cualquier rama que no sea main): nivel RÁPIDO. Lint, tipos,
#     capas, unitarios y gitleaks sobre los commits de la PR; si la PR toca rutas
#     que cubre la integración, además el subconjunto crítico `-m aislamiento`
#     (RLS forzada, aislamiento entre tenants, webhooks, IDOR); si toca el modelo C4,
#     su validación y el drift de docs/architecture/c4.md. Además, el gate de
#     evals y journeys en REPLAY (último paso del job `integracion`): desde las
#     grabaciones de `evals/cassettes/`, sin red ni LLM_API_KEY (adenda 2026-10-10 de
#     ADR-0120; fundido en `integracion` por la adenda 2026-10-28).
#   - Una PR → develop con la etiqueta `integracion-completa` corre la integración COMPLETA
#     (para cambios del loop, el alta o la base; el gate de evals sigue en replay). Poner la
#     etiqueta dispara el CI.
#   - push → develop (post-merge), PR → main y push → main: nivel COMPLETO.
#     Integración completa, gitleaks sobre toda la historia, modelo C4 y, hacia main, drift de
#     docs/openapi.json. El gate de evals y journeys con el LLM REAL corre SOLO en la
#     PR → main (una vez por release). En el push a develop corre en REPLAY, sin costo
#     (decisión del dueño 2026-10-10: develop no gasta LLM; adenda de ADR-0120).
on:
  push:
    # `develop` recibe lotes por push directo además de PRs: se gatean completos.
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Mínimo privilegio: los jobs ejecutan código de la PR en un runner self-hosted.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Claves de prueba (no son secretos reales), comunes a unitarios e integración.
  MASTER_ENCRYPTION_KEY: GpsiZ2sgMd4SvLHGp4Bs5xdaQLlQ1cByyK6DCNxVwL4=
  TOKEN_MASTER_KEYS: '{"k1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}'
  TOKEN_ACTIVE_KEY_ID: k1
  APP_SECRET_KEY: ci-only-not-a-secret-app-key
  # App Secret de Meta de prueba (HMAC del webhook). No es un secreto real.
  WHATSAPP_APP_SECRET: ci-meta-app-secret-not-real
  APP_ENV: development
  # Rutas que cubren los tests de integración: si una PR rápida no toca ninguna,
  # se salta el job de integración.
  RUTAS_INTEGRACION: '^(core/|packages/|plugins/|alembic/|cli/|tests/integration/|tests/conftest\.py$|alembic\.ini$|scripts/init_db\.py$|scripts/install_plugins\.sh$|pyproject\.toml$|uv\.lock$|\.github/|docker/postgres/)'
  # Rutas del modelo C4 (ADR-0189): si una PR rápida no toca ninguna, no se levanta el MCP.
  RUTAS_C4: '^(docs/architecture/|scripts/export_c4\.py$|\.github/workflows/ci\.yml$)'
  # Versión fija: otra versión puede exportar otro Mermaid. Al subirla, regenerar c4.md y cambiar su `docker run`.
  STRUCTURIZR_MCP_IMAGE: structurizr/mcp:2026.04.20@sha256:fc4ef98b7da925d62b08c71a90eb995a527fae30e2c04b39e3041f253c135539

jobs:
  rapido:
    # Sin `needs`: lint y unitarios arrancan en t=0 y el feedback rápido nunca queda detrás de nada.
    runs-on: [self-hosted, linux, x64]
    # Seguridad: no ejecutar workflows de PRs de forks en el runner self-hosted.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Historia completa: gitleaks la necesita.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/preparar-entorno

      - name: Lint
        run: ruff check core cli scripts alembic evals tests packages

      - name: Chequeo de tipos (basedpyright, módulos estrictos)
        # HU-ARCH-24: verifica tipos y FALLA el build ante un error. Se usa
        # basedpyright (no mypy) porque mypy requiere sqlite en el metastore y
        # el Python del runner no trae `_sqlite3`. Alcance acotado por
        # `pyrightconfig.json` a módulos puros; el resto es deuda gradual.
        run: basedpyright

      - name: Capas (import-linter)
        # Invariante 5: ningún pack importa de otro pack; y contratos congelados.
        # `packages/pack-*/` pone cada paquete fuente (packages/pack-X/pack_x) en
        # el path para que grimp los escanee además de `core`.
        run: |
          export PYTHONPATH="$(printf '%s:' packages/pack-*/ packages/contracts)"
          lint-imports

      - name: Tests unitarios
        # Sin Postgres ni Redis: `tests/conftest.py` fija URLs falsas por defecto. En paralelo
        # (xdist, 4 workers): sin estado compartido entre tests, y el runner comparte host con
        # otros jobs, así que no `auto`. Los de integración se saltan solos (sin
        # AGENT_CORE_INTEGRATION) y siguen en serie en su job.
        run: pytest -q -n 4

      - name: Linter de procedimientos (procedure/1)
        # ADR-0113 / HU-AOS-03: el mismo validador y linter del CLI y de la API, contra las
        # acciones del binario. Hoy cubre los procedimientos críticos de ejemplo; los de las
        # habilidades se suman cuando las publiquen (HU-AOS-07/16).
        run: agent-core procedures lint tests/fixtures/procedures/*.json

      - name: Linter de agentes (agentspec/3 y kernelspec/1)
        # ADR-0113 / HU-AOS-12: el mismo validador del CLI y de la API al guardar un borrador.
        run: agent-core agent lint tests/fixtures/agents/*.json

      - name: Modelo C4 válido y c4.md sin drift
        # ADR-0189: `export_c4.py` valida `workspace.dsl` y reescribe los diagramas; si c4.md
        # cambia, la PR tocó el modelo sin regenerar. Va en `rapido` porque `integracion` se
        # salta las PRs que solo tocan docs. El MCP no se declara en `services` para no
        # levantarlo en las PRs que no tocan el modelo.
        env:
          BASE: ${{ github.base_ref }}
          EVENTO: ${{ github.event_name }}
        run: |
          # Nivel rápido = PR a una rama que no es main (mismo criterio que el paso `nivel` de `integracion`).
          if [ "$EVENTO" = "pull_request" ] && [ "$BASE" != "main" ]; then
            # Si el diff falla, el paso falla (`-e`): nunca se salta el chequeo a ciegas.
            CAMBIOS="$(git diff --no-renames --name-only "origin/${BASE}...HEAD")"
            if ! grep -Eq "$RUTAS_C4" <<< "$CAMBIOS"; then
              echo "::notice title=Modelo C4 omitido::La PR no toca el modelo C4."
              exit 0
            fi
          fi
          # Puerto dinámico: varios runners pueden compartir la máquina.
          NOMBRE="c4-mcp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --rm --name "$NOMBRE" -p 127.0.0.1::3000 -e PORT=3000 "$STRUCTURIZR_MCP_IMAGE" -dsl -mermaid -plantuml > /dev/null
          export STRUCTURIZR_MCP_URL="http://$(docker port "$NOMBRE" 3000/tcp)/mcp"
          for _ in $(seq 1 60); do curl -s -o /dev/null --max-time 2 "$STRUCTURIZR_MCP_URL" && break; sleep 1; done
          python scripts/export_c4.py
          if ! git diff --exit-code -- docs/architecture/c4.md; then
            echo "::error file=docs/architecture/c4.md::c4.md no coincide con workspace.dsl. Regenerar con scripts/export_c4.py (ver cómo levantar el MCP al inicio de c4.md) y commitear el resultado."
            exit 1
          fi

      - name: Apagar el MCP de Structurizr
        # Aparte del paso anterior: también corre si el CI se cancela con un push nuevo.
        if: always()
        run: docker rm -f "c4-mcp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > /dev/null 2>&1 || true

      - name: Contrato OpenAPI sin drift (hacia main)
        # Checklist de release: `docs/openapi.json` refleja `/api/v1` (ADR-0077).
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: |
          python scripts/export_openapi.py
          git diff --exit-code docs/openapi.json

      - name: Contrato OpenAPI compatible (PR a develop)
        # La APK instalada no se actualiza con el backend: un cambio incompatible en `/api/v1`
        # la rompe. Si es intencional, etiqueta el PR con `api-incompatible` y relanza el job.
        # Un valor nuevo en un enum de respuesta solo avisa (`.github/oasdiff-niveles.txt`).
        if: github.base_ref == 'develop' && !contains(github.event.pull_request.labels.*.name, 'api-incompatible')
        env:
          BASE: ${{ github.base_ref }}
        run: |
          VER=1.34.1
          SHA=75775f65b0adebd26a8e013af51a799342dfdc6262d89efa9e3b7bdf89657d90
          BIN="$HOME/.cache/ci-bin/oasdiff-${VER}"
          if [ ! -x "$BIN" ]; then
            mkdir -p "$HOME/.cache/ci-bin"
            curl -fsSL -o "$RUNNER_TEMP/oasdiff.tar.gz" \
              "https://github.com/oasdiff/oasdiff/releases/download/v${VER}/oasdiff_${VER}_linux_amd64.tar.gz"
            echo "$SHA  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP" oasdiff
            mv -f "$RUNNER_TEMP/oasdiff" "$BIN.$$" && mv -f "$BIN.$$" "$BIN"
          fi
          git show "origin/${BASE}:docs/openapi.json" > "$RUNNER_TEMP/openapi-base.json"
          "$BIN" breaking --severity-levels .github/oasdiff-niveles.txt --fail-on ERR \
            "$RUNNER_TEMP/openapi-base.json" docs/openapi.json

      - name: Gitleaks (secret scan)
        # Falla si aparece una credencial real; las claves de prueba del repo están
        # allowlisteadas en `.gitleaks.toml`. En el nivel rápido solo se escanean
        # los commits de la PR; en el completo, toda la historia.
        # Binario fijado en $RUNNER_TEMP: sin caché ni /tmp (que dejaba trabado
        # a `gitleaks-action` en el runner self-hosted).
        env:
          BASE: ${{ github.base_ref }}
          EVENTO: ${{ github.event_name }}
        run: |
          VER=8.24.3
          # Binario en una caché del host (como UV_CACHE_DIR): la descarga costaba ~30 s por corrida.
          # Se baja a un directorio propio del job y se mueve de forma atómica: dos runners pueden
          # llegar a la vez y nunca ven un binario a medias.
          BIN="$HOME/.cache/ci-bin/gitleaks-${VER}"
          if [ ! -x "$BIN" ]; then
            mkdir -p "$HOME/.cache/ci-bin"
            curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP" gitleaks
            mv -f "$RUNNER_TEMP/gitleaks" "$BIN.$$" && mv -f "$BIN.$$" "$BIN"
          fi
          # Nivel rápido = PR a una rama que no es main (mismo criterio que el paso `nivel` de `integracion`).
          if [ "$EVENTO" = "pull_request" ] && [ "$BASE" != "main" ]; then
            "$BIN" detect --source . --redact -v --log-opts="origin/${BASE}..HEAD"
          else
            "$BIN" detect --source . --redact -v
          fi

  integracion:
    # Seguridad: no ejecutar workflows de PRs de forks en el runner self-hosted.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      # Para bajar la imagen de Postgres del CI desde GHCR.
      packages: read
    services:
      postgres:
        # Misma imagen que producción (pg17 + pgvector + PostGIS, ADR-0058),
        # publicada por `ci-postgres-image.yml`.
        image: ghcr.io/${{ github.repository_owner }}/solvershub-postgres:pg17-postgis
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: agent_core
          POSTGRES_PASSWORD: agent_core
          POSTGRES_DB: agent_core
        # Puerto del host dinámico: varios runners pueden compartir la máquina.
        ports: ["5432"]
        # Datos en memoria: en el runner self-hosted cada job dejaba un volumen anónimo de
        # Postgres (~70 MB) que nadie borraba; en octubre llenaron 69 GB del disco.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U agent_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379"]
        options: >-
          --tmpfs /data
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          # El diff contra la rama base necesita la historia.
          fetch-depth: 0
          persist-credentials: false

      - name: Nivel del CI y rutas tocadas
        id: nivel
        env:
          BASE: ${{ github.base_ref }}
          COMPLETA: ${{ contains(github.event.pull_request.labels.*.name, 'integracion-completa') }}
        run: |
          # `replay`: gate de evals y journeys sin LLM (PR a una rama que no es main, o push a develop).
          # No depende de `relevante`: una PR que solo toca `evals/` o `scripts/gate_evals.sh` no está
          # en RUTAS_INTEGRACION y el replay es lo único que la verifica.
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$BASE" != "main" ] && [ "$COMPLETA" = "true" ]; then
            # Etiqueta `integracion-completa`: la integración entera; el gate sigue en replay (sin LLM).
            echo "nivel=completo" >> "$GITHUB_OUTPUT"
            echo "replay=true" >> "$GITHUB_OUTPUT"
            echo "relevante=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "$BASE" != "main" ]; then
            echo "nivel=rapido" >> "$GITHUB_OUTPUT"
            echo "replay=true" >> "$GITHUB_OUTPUT"
            # Si el diff falla, el paso falla (`-e`): nunca se salta la integración a ciegas.
            # `--no-renames`: mover un archivo fuera de `core/` también cuenta como tocarlo.
            CAMBIOS="$(git diff --no-renames --name-only "origin/${BASE}...HEAD")"
            if grep -E "$RUTAS_INTEGRACION" <<< "$CAMBIOS" > /dev/null; then
              echo "relevante=true" >> "$GITHUB_OUTPUT"
            else
              echo "relevante=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Integración omitida::La PR no toca rutas que cubre la integración."
            fi
          else
            echo "nivel=completo" >> "$GITHUB_OUTPUT"
            echo "relevante=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/develop" ]; then
              echo "replay=true" >> "$GITHUB_OUTPUT"
            else
              echo "replay=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Si la PR no toca rutas que cubre la integración ni corre el replay, los servicios ya están arriba pero no se corre nada.
      - name: URLs del stack (puertos dinámicos)
        if: steps.nivel.outputs.relevante == 'true' || steps.nivel.outputs.replay == 'true'
        # El contexto `job` no está disponible en el `env` del job: se exportan aquí.
        run: |
          PG=${{ job.services.postgres.ports['5432'] }}
          RD=${{ job.services.redis.ports['6379'] }}
          {
            echo "DATABASE_URL=postgresql+asyncpg://app_runtime:app_runtime@localhost:${PG}/agent_core"
            echo "MIGRATIONS_DATABASE_URL=postgresql+asyncpg://agent_core:agent_core@localhost:${PG}/agent_core"
            echo "REDIS_URL=redis://localhost:${RD}/0"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/preparar-entorno
        if: steps.nivel.outputs.relevante == 'true' || steps.nivel.outputs.replay == 'true'

      - name: Migrar y sembrar
        id: migrar
        if: steps.nivel.outputs.relevante == 'true' || steps.nivel.outputs.replay == 'true'
        env:
          # Password determinística solo para que los tests de integración puedan
          # loguearse (default de init_db.py es aleatoria, correcto en producción).
          ADMIN_PASSWORD: admin123
        run: |
          agent-core db migrate
          python scripts/init_db.py

      # Integración en paralelo (pytest-xdist, ADR-0120 adenda 2026-10-28): 3 workers, y `loadfile` para que
      # los fixtures de scope `module` queden dentro de un solo proceso. Cada worker clona la base migrada y
      # sembrada arriba (`agent_core_gwN`) y usa su propia base de Redis: ver tests/integration/_aislamiento_xdist.py.
      # Sin `-n auto`: el host comparte CPU con otros runners.
      - name: Integración — subconjunto crítico (nivel rápido)
        if: steps.nivel.outputs.relevante == 'true' && steps.nivel.outputs.nivel == 'rapido'
        env:
          AGENT_CORE_INTEGRATION: "1"
        # `--durations` y el junit sirven para medir dónde se va el tiempo (HU de CI rápido,
        # ADR-0120 adenda 2026-10-28): decide si la integración se puede repartir entre workers.
        run: pytest tests/integration -q -m aislamiento -n 3 --dist loadfile --durations=40 --junitxml="$RUNNER_TEMP/integracion-junit.xml"

      - name: Integración completa (aislamiento multi-tenant, RLS, webhooks)
        if: steps.nivel.outputs.relevante == 'true' && steps.nivel.outputs.nivel == 'completo'
        env:
          AGENT_CORE_INTEGRATION: "1"
        run: pytest tests/integration -q -n 3 --dist loadfile --durations=40 --junitxml="$RUNNER_TEMP/integracion-junit.xml"

      - name: Duraciones de la integración (junit)
        if: always() && steps.nivel.outputs.relevante == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: integracion-junit
          path: ${{ runner.temp }}/integracion-junit.xml
          retention-days: 14
          if-no-files-found: ignore

      # Gate de evals y journeys en replay (adenda 2026-10-10 de ADR-0120, adenda de ADR-0119): las respuestas del
      # LLM salen de `evals/cassettes/`, sin red ni LLM_API_KEY (el script la fuerza vacía). Si la PR cambia un
      # prompt, una tool o el flujo sin regrabar, falla con exit 3, el diff y el comando para regrabar
      # (`bash scripts/gate_evals.sh record`, con OK del dueño). No mide el modelo: eso lo hace el gate en vivo de la PR → main.
      # Corre DESPUÉS de los tests y contra `agent_core` sin clonar: los workers de xdist trabajan en `agent_core_gwN`,
      # así que `agent_core` sigue recién migrada y sembrada, que es lo que exige el replay. Redis `/0`; los workers usan `/1..N`.
      # Se ejecuta aunque los tests hayan fallado, para ver los dos resultados (hasta antes de fundirlo eran jobs separados).
      - name: Gate de evals y journeys (replay, sin LLM)
        if: ${{ !cancelled() && steps.nivel.outputs.replay == 'true' && steps.migrar.outcome == 'success' }}
        run: bash scripts/gate_evals.sh replay

      - name: Gate de evals (subconjunto crítico, LLM real)
        # Solo en la PR → main (la release): el único punto del CI que gasta LLM. En el
        # push a develop el gate corre en replay (último paso de `integracion`), sin costo.
        if: steps.nivel.outputs.nivel == 'completo' && github.event_name == 'pull_request' && github.base_ref == 'main' && github.actor != 'dependabot[bot]'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        # Camino feliz + manipulación + escalamiento: las regresiones que importan.
        run: python evals/runner.py "06,07,08,21,22,23,24,25,26,36"

      - name: Gate de journeys (subconjunto estable)
        # HU-SUB-12: conversación completa contra el loop real con pagos simulados (sin
        # red). 01 informa planes; 05 recorre cargo → recordatorio → vencida → pago →
        # reactivación con saltos de reloj. Solo en la PR → main, como el paso anterior.
        if: steps.nivel.outputs.nivel == 'completo' && github.event_name == 'pull_request' && github.base_ref == 'main' && github.actor != 'dependabot[bot]'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python evals/journeys.py "01,05" --umbral 1.0

      - name: Gate de evals no ejecutado (Dependabot)
        if: steps.nivel.outputs.nivel == 'completo' && github.event_name == 'pull_request' && github.base_ref == 'main' && github.actor == 'dependabot[bot]'
        run: echo "::notice title=Evals no ejecutados::Dependabot no tiene LLM_API_KEY. El gate en vivo corre en la PR de release hacia main."
