name: Evals con LLM real (set completo, a demanda)

# Decisión del dueño (2026-10-10): develop no gasta LLM. Ya no hay corrida nocturna: el set
# completo se lanza a mano (Actions → Run workflow) cuando haga falta medir, por ejemplo antes
# de una release, con el k que se elija (cada intento llama al LLM real). Adenda de ADR-0120.
on:
  workflow_dispatch:
    inputs:
      k:
        description: "Intentos por escenario (cada intento gasta saldo del LLM)"
        default: "2"

jobs:
  evals-full:
    runs-on: [self-hosted, linux, x64]
    concurrency:
      group: evals-nightly
      cancel-in-progress: false
    permissions:
      contents: read
      # Para bajar la imagen de Postgres del CI desde GHCR.
      packages: read
    services:
      postgres:
        # Misma imagen que producción y que `ci.yml` (pg17 + pgvector + PostGIS).
        image: ghcr.io/${{ github.repository_owner }}/solvershub-postgres:pg17-postgis
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: agent_core
          POSTGRES_PASSWORD: agent_core
          POSTGRES_DB: agent_core
        # Puerto del host dinámico: no choca con un job del CI en otro runner del host.
        ports: ["5432"]
        # Datos en memoria: en el runner self-hosted cada job dejaba un volumen anónimo de
        # Postgres (~70 MB) que nadie borraba; en octubre llenaron 69 GB del disco.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U agent_core"
          --health-interval 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379"]
        options: >-
          --tmpfs /data
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 12
    env:
      MASTER_ENCRYPTION_KEY: GpsiZ2sgMd4SvLHGp4Bs5xdaQLlQ1cByyK6DCNxVwL4=
      # Mismos que `ci.yml`: sin estas, los escenarios fallan al cifrar contenido.
      TOKEN_MASTER_KEYS: '{"k1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}'
      TOKEN_ACTIVE_KEY_ID: k1
      APP_SECRET_KEY: ci-only-not-a-secret-app-key
      APP_ENV: development
    steps:
      - uses: actions/checkout@v7

      - name: URLs del stack (puertos dinámicos)
        run: |
          PG=${{ job.services.postgres.ports['5432'] }}
          RD=${{ job.services.redis.ports['6379'] }}
          {
            echo "DATABASE_URL=postgresql+asyncpg://app_runtime:app_runtime@localhost:${PG}/agent_core"
            echo "MIGRATIONS_DATABASE_URL=postgresql+asyncpg://agent_core:agent_core@localhost:${PG}/agent_core"
            echo "REDIS_URL=redis://localhost:${RD}/0"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/preparar-entorno

      - name: Migrar y sembrar
        run: |
          agent-core db migrate
          python scripts/init_db.py
      # HU-ARCH-28 (ADR-0119): cada escenario corre k = 4 veces. El umbral del 0A
      # (≥95 % tres noches) se mide sobre pass@1 y no cambia; pass^4 y los
      # escenarios inestables se reportan junto a él. k = 8 solo antes de una release.
      - name: Golden set completo
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python evals/runner.py --k ${{ inputs.k }} --umbral 0.95 --reporte evals/reportes/golden.json
      - name: Journeys (HU-SUB-12)
        # Conversaciones completas con pagos simulados y reloj, y clientes simulados
        # (HU-ARCH-28); el reporte queda como artefacto para comparar noches.
        if: always()
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python evals/journeys.py --k ${{ inputs.k }} --umbral 0.95 --reporte evals/reportes/journeys.json
      - name: Reporte de evals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-${{ github.run_number }}
          path: |
            evals/reportes/golden.json
            evals/reportes/journeys.json
          if-no-files-found: warn
          retention-days: 30
