services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_core}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_core}
      POSTGRES_DB: ${POSTGRES_DB:-agent_core}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_core}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    build: .
    command: uvicorn core.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    # Las variables internas usan el hostname del servicio Docker, no localhost
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_core}:${POSTGRES_PASSWORD:-agent_core}@postgres:5432/${POSTGRES_DB:-agent_core}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    volumes:
      - ./sdd:/app/sdd
      - ./plugins:/app/plugins
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    command: celery -A core.tasks.celery_app:celery worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_core}:${POSTGRES_PASSWORD:-agent_core}@postgres:5432/${POSTGRES_DB:-agent_core}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A core.tasks.celery_app:celery beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_core}:${POSTGRES_PASSWORD:-agent_core}@postgres:5432/${POSTGRES_DB:-agent_core}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
