# El nombre del proyecto fija la identidad de contenedores y volúmenes: sin él,
# dos clones del framework comparten la base de datos. `agent-core init` lo
# escribe en el .env.
#
# Es obligatorio a propósito. Con un valor por defecto, cualquier .env que no lo
# declare caería en el MISMO proyecto que los demás clones y compartiría el
# volumen pgdata sin avisar; es preferible fallar aquí con una instrucción clara.
name: ${COMPOSE_PROJECT_NAME:?falta COMPOSE_PROJECT_NAME en el .env. Añádelo (un nombre único para este asistente) o regenera el .env con 'agent-core init --force'}

services:
  postgres:
    # pgvector + PostGIS en la misma base (ADR-0058). Ver docker/postgres/Dockerfile.
    build:
      context: ./docker/postgres
    image: agent-core-postgres:pg17-pgvector-postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_core}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_core}
      POSTGRES_DB: ${POSTGRES_DB:-agent_core}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Autentica de verdad, no solo comprueba que el servidor acepta conexiones:
      # `pg_isready` da healthy aunque el rol del .env no exista en el volumen
      # (caso de un pgdata heredado de otra instalación), y entonces las
      # migraciones morían justo después con "role does not exist".
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$${POSTGRES_PASSWORD} psql -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'select 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    build: .
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: uvicorn core.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    # Las variables internas usan el hostname del servicio Docker, no localhost.
    # RLS se aplica de verdad solo si el runtime conecta como app_runtime (NO dueño);
    # las migraciones corren como el dueño vía MIGRATIONS_DATABASE_URL (ADR-0001).
    environment:
      AGENT_CORE_ROLE: api
      DATABASE_URL: postgresql+asyncpg://app_runtime:app_runtime@postgres:5432/${POSTGRES_DB:-agent_core}
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_core}:${POSTGRES_PASSWORD:-agent_core}@postgres:5432/${POSTGRES_DB:-agent_core}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    volumes:
      - ./sdd:/app/sdd
      - ./packages:/app/packages
      - ./plugins:/app/plugins
      # Artefactos por tenant (flow.json, playbooks, catalog.json) — ADR-0085:
      # sin volumen, un redeploy los pierde.
      - tenants-data:/app/tenants
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\" >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: celery -A core.tasks.celery_app:celery worker --loglevel=info
    env_file: .env
    environment:
      AGENT_CORE_ROLE: worker
      DATABASE_URL: postgresql+asyncpg://app_runtime:app_runtime@postgres:5432/${POSTGRES_DB:-agent_core}
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_core}:${POSTGRES_PASSWORD:-agent_core}@postgres:5432/${POSTGRES_DB:-agent_core}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./sdd:/app/sdd
      - ./packages:/app/packages
      - ./plugins:/app/plugins
      # Artefactos por tenant (flow.json, playbooks, catalog.json) — ADR-0085:
      # sin volumen, un redeploy los pierde.
      - tenants-data:/app/tenants
    depends_on:
      # Espera a core-api: es quien aplica las migraciones. Arrancar antes
      # significaría trabajar contra un esquema a medio migrar.
      core-api:
        condition: service_healthy

  celery-beat:
    build: .
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: celery -A core.tasks.celery_app:celery beat --loglevel=info
    env_file: .env
    environment:
      AGENT_CORE_ROLE: beat
      DATABASE_URL: postgresql+asyncpg://app_runtime:app_runtime@postgres:5432/${POSTGRES_DB:-agent_core}
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_core}:${POSTGRES_PASSWORD:-agent_core}@postgres:5432/${POSTGRES_DB:-agent_core}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./sdd:/app/sdd
      - ./packages:/app/packages
      - ./plugins:/app/plugins
      # Artefactos por tenant (flow.json, playbooks, catalog.json) — ADR-0085:
      # sin volumen, un redeploy los pierde.
      - tenants-data:/app/tenants
    depends_on:
      core-api:
        condition: service_healthy

  # Canal WhatsApp Web no oficial (ADR-0074). Apagado por defecto: solo arranca
  # con `--profile waweb` Y `WAWEB_ENABLED=true`. Un socket por tenant.
  waweb-connector:
    build: .
    entrypoint: ["/app/scripts/entrypoint-connector.sh"]
    profiles: ["waweb"]
    env_file: .env
    environment:
      AGENT_CORE_ROLE: connector
      DATABASE_URL: postgresql+asyncpg://app_runtime:app_runtime@postgres:5432/${POSTGRES_DB:-agent_core}
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_core}:${POSTGRES_PASSWORD:-agent_core}@postgres:5432/${POSTGRES_DB:-agent_core}
      REDIS_URL: redis://redis:6379/0
      WAWEB_SESSION_DIR: /tmp/waweb-sessions
    volumes:
      - ./packages:/app/packages
      - ./plugins:/app/plugins
    # Las credenciales de sesión viven en RAM; la copia durable y cifrada está
    # en `waweb_sessions.creds_encrypted`.
    # `mode=1777`: la imagen corre como `app`; un tmpfs root:root 0755 impedía
    # crear los directorios de sesión y el connector no emitía QR (2026-10-28).
    tmpfs:
      - /tmp/waweb-sessions:mode=1777
    depends_on:
      core-api:
        condition: service_healthy

volumes:
  pgdata:
  # Artefactos de tenant (ADR-0085): persisten entre redeploys y se respaldan.
  tenants-data:
