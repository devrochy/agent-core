# El nombre del proyecto fija la identidad de contenedores y volúmenes: sin él,
# dos clones del framework comparten la base de datos. `agent-core init` lo
# escribe en el .env.
#
# Es obligatorio a propósito. Con un valor por defecto, cualquier .env que no lo
# declare caería en el MISMO proyecto que los demás clones y compartiría el
# volumen pgdata sin avisar; es preferible fallar aquí con una instrucción clara.
name: ${COMPOSE_PROJECT_NAME:?falta COMPOSE_PROJECT_NAME en el .env. Añádelo (un nombre único para este asistente) o regenera el .env con 'agent-core init --force'}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_core}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_core}
      POSTGRES_DB: ${POSTGRES_DB:-agent_core}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Autentica de verdad, no solo comprueba que el servidor acepta conexiones:
      # `pg_isready` da healthy aunque el rol del .env no exista en el volumen
      # (caso de un pgdata heredado de otra instalación), y entonces las
      # migraciones morían justo después con "role does not exist".
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$${POSTGRES_PASSWORD} psql -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'select 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    build: .
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: uvicorn core.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    # Las variables internas usan el hostname del servicio Docker, no localhost
    environment:
      AGENT_CORE_ROLE: api
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_core}:${POSTGRES_PASSWORD:-agent_core}@postgres:5432/${POSTGRES_DB:-agent_core}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    volumes:
      - ./sdd:/app/sdd
      - ./plugins:/app/plugins
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\" >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: celery -A core.tasks.celery_app:celery worker --loglevel=info
    env_file: .env
    environment:
      AGENT_CORE_ROLE: worker
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_core}:${POSTGRES_PASSWORD:-agent_core}@postgres:5432/${POSTGRES_DB:-agent_core}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./sdd:/app/sdd
      - ./plugins:/app/plugins
    depends_on:
      # Espera a core-api: es quien aplica las migraciones. Arrancar antes
      # significaría trabajar contra un esquema a medio migrar.
      core-api:
        condition: service_healthy

  celery-beat:
    build: .
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: celery -A core.tasks.celery_app:celery beat --loglevel=info
    env_file: .env
    environment:
      AGENT_CORE_ROLE: beat
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_core}:${POSTGRES_PASSWORD:-agent_core}@postgres:5432/${POSTGRES_DB:-agent_core}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./sdd:/app/sdd
      - ./plugins:/app/plugins
    depends_on:
      core-api:
        condition: service_healthy

volumes:
  pgdata:
