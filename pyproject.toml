[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "0.1.0"
description = "Framework para construir asistentes IA empresariales como monolitos modulares con plugins embebidos"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Agent Core Team" }]
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "pgvector>=0.3",
    # Cache / colas
    "redis>=5.0",
    "celery>=5.4",
    # Config / validación
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # HTTP (LLM providers, canales)
    "httpx>=0.27",
    # Seguridad
    "cryptography>=43.0",
    "bcrypt>=4.2",
    # Observabilidad
    "structlog>=24.0",
    # CLI
    "typer>=0.12",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
# Embeddings locales (memoria vectorial sin API externa)
embeddings-local = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
agent-core = "cli.main:app"

[tool.setuptools.packages.find]
include = ["core*", "cli*"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
